[package]
name = "blyg-conformance-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Drives blygger-desktop's blyg-render and blyg-core against the conformance samples and grammar corpus (read-only use of the desktop crates)."

# Standalone: not part of blygger-desktop's workspace.
[workspace]

[dependencies]
blyg-render = { path = "/Users/aneeshsathe/Code/blygger-desktop/crates/blyg-render" }
blyg-core = { path = "/Users/aneeshsathe/Code/blygger-desktop/crates/blyg-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
